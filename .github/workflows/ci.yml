# Generated by tools/snappy-ci from .snappy-ci.env. Do not edit by hand:
# change the config, then run `snappy-ci render .`.
name: CI

on:
  push:
    branches: [develop, 'release/**']
    tags:
      - '16.0'
      - '18.0'
      - '26.0'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit_gate:
    name: Unique commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
    steps:
      - id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh run list --repo "${{ github.repository }}" --commit "${{ github.sha }}" \
            --workflow "${{ github.workflow }}" --status success --json databaseId -q 'length' 2>/dev/null || echo 0)
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: CI already succeeded for this commit (duplicate tag/branch push)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (macOS)

    needs: commit_gate
    if: needs.commit_gate.outputs.skip != 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test with coverage
        run: swift test --enable-code-coverage
      - name: Coverage gate (min 100%)
        env:
          COVERAGE_MIN: "100"
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN_PATH" -maxdepth 1 -name '*.xctest' | head -1)
          if [ -z "$XCTEST" ]; then echo "No test bundle found"; exit 1; fi
          xcrun llvm-cov report \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            -ignore-filename-regex='Tests/|\.build/|SnappyBT/CoreBluetooth' \
            > coverage.txt
          cat coverage.txt
          LINE_PCT=$(grep '^TOTAL' coverage.txt | awk '{ gsub("%","",$(NF-3)); print $(NF-3) }')
          echo "Line coverage: $LINE_PCT% (min $COVERAGE_MIN%)"
          awk -v got="$LINE_PCT" -v min="$COVERAGE_MIN" 'BEGIN { exit !(got + 0 >= min + 0) }' \
            || { echo "Coverage gate failed"; exit 1; }
  sanitize-thread:
    name: Test (Thread Sanitizer)

    needs: commit_gate
    if: needs.commit_gate.outputs.skip != 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread
  sim-tests:
    name: Test ${{ matrix.name }} Simulator

    needs: commit_gate
    if: needs.commit_gate.outputs.skip != 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            device: iPhone 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test on simulator
        env:
          PLATFORM: ${{ matrix.name }}
          DEVICE: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available -j > devices.json
          RES=$(python3 - devices.json "$PLATFORM" "$DEVICE" <<'PY'
          import json, sys
          path, platform, prefix = sys.argv[1:4]
          devices = json.load(open(path))["devices"]
          def parts(key):
              return key.rsplit(".", 1)[-1].split("-")  # SimRuntime.iOS-26-5 -> [iOS, 26, 5]
          def version(key):
              return tuple(int(p) for p in parts(key)[1:] if p.isdigit())
          def os_label(key):
              ver = parts(key)
              return ".".join(ver[1:3]) if len(ver) >= 3 else ver[1]
          def emit(key, d):
              print(f"{d['udid']}\t{d['name']}\t{os_label(key)}")
              sys.exit(0)
          for key in sorted((k for k in devices if parts(k)[0] == platform), key=version, reverse=True):
              for d in devices[key]:
                  if d.get("isAvailable", True) and d["name"] == prefix:
                      emit(key, d)
          for key in sorted((k for k in devices if parts(k)[0] == platform), key=version, reverse=True):
              for d in devices[key]:
                  if d.get("isAvailable", True) and d["name"].startswith(prefix):
                      emit(key, d)
          PY
          )
          UDID=$(echo "$RES" | cut -f1)
          SIM_NAME=$(echo "$RES" | cut -f2)
          SIM_OS=$(echo "$RES" | cut -f3)
          if [ -z "$UDID" ]; then echo "No available $DEVICE simulator for $PLATFORM"; exit 1; fi
          echo "Using simulator $SIM_NAME ($UDID) OS=$SIM_OS"
          if [ "$PLATFORM" = "watchOS" ]; then
            xcrun simctl list pairs available -j > pairs.json
            PHONE=$(python3 - pairs.json "$UDID" <<'PY'
          import json, sys
          pairs_doc = json.load(open(sys.argv[1]))
          watch = sys.argv[2]
          pairs = pairs_doc.get("pairs") or []
          if isinstance(pairs, dict):
              pairs = list(pairs.values())
          for p in pairs:
              w = (p.get("watch") or {})
              if w.get("udid") == watch:
                  ph = p.get("phone") or {}
                  u = ph.get("udid") or ""
                  if u:
                      print(u)
                  break
          PY
            )
            if [ -n "$PHONE" ]; then
              echo "Booting paired iPhone $PHONE"
              xcrun simctl boot "$PHONE" 2>/dev/null || true
              xcrun simctl bootstatus "$PHONE" -b
            fi
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -scheme SnappyBT \
            -destination "platform=$PLATFORM Simulator,name=$SIM_NAME,OS=$SIM_OS" \
            CODE_SIGNING_ALLOWED=NO
  example:
    name: Build Example app

    needs: commit_gate
    if: needs.commit_gate.outputs.skip != 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build SnappyBTDemo
        env:
          PLATFORM: iOS
          DEVICE: iPhone 18
        run: |
          xcrun simctl list devices available -j > devices.json
          RES=$(python3 - devices.json "$PLATFORM" "$DEVICE" <<'PY'
          import json, sys
          path, platform, prefix = sys.argv[1:4]
          devices = json.load(open(path))["devices"]
          def parts(key):
              return key.rsplit(".", 1)[-1].split("-")  # SimRuntime.iOS-26-5 -> [iOS, 26, 5]
          def version(key):
              return tuple(int(p) for p in parts(key)[1:] if p.isdigit())
          def os_label(key):
              ver = parts(key)
              return ".".join(ver[1:3]) if len(ver) >= 3 else ver[1]
          def emit(key, d):
              print(f"{d['udid']}\t{d['name']}\t{os_label(key)}")
              sys.exit(0)
          for key in sorted((k for k in devices if parts(k)[0] == platform), key=version, reverse=True):
              for d in devices[key]:
                  if d.get("isAvailable", True) and d["name"] == prefix:
                      emit(key, d)
          for key in sorted((k for k in devices if parts(k)[0] == platform), key=version, reverse=True):
              for d in devices[key]:
                  if d.get("isAvailable", True) and d["name"].startswith(prefix):
                      emit(key, d)
          PY
          )
          UDID=$(echo "$RES" | cut -f1)
          SIM_NAME=$(echo "$RES" | cut -f2)
          SIM_OS=$(echo "$RES" | cut -f3)
          if [ -z "$UDID" ]; then echo "No available $DEVICE simulator for $PLATFORM"; exit 1; fi
          echo "Using simulator $SIM_NAME ($UDID) OS=$SIM_OS"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild build \
            -project Example/SnappyBTDemo.xcodeproj \
            -scheme SnappyBTDemo \
            -destination "platform=$PLATFORM Simulator,name=$SIM_NAME,OS=$SIM_OS" \
            CODE_SIGNING_ALLOWED=NO
  api-check:
    name: API breaking changes

    needs: commit_gate
    if: needs.commit_gate.outputs.skip != 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Diagnose API breaking changes vs latest tag of this line
        run: |
          ref="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^release/([0-9]+)\.x$ ]]; then
            baseline=$(git tag --list "${BASH_REMATCH[1]}.*" --sort=-v:refname | head -1)
          else
            baseline=$(git tag --list --sort=-v:refname | head -1)
          fi
          if [ -z "$baseline" ]; then
            echo "::notice::No baseline tag for $ref; API check skipped"
            exit 0
          fi
          echo "Baseline: $baseline"
          swift package diagnose-api-breaking-changes "$baseline"
  hygiene-check:
    name: Hygiene check

    needs: commit_gate
    if: needs.commit_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No personal emails, local paths, secrets, or agent attribution
        run: |
          python3 .github/scripts/hygiene_check.py tree
          python3 .github/scripts/hygiene_check.py history
